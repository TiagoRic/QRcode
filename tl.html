<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escolha</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
    background: #f0f0f0;
  }

  h2 {
    font-size: 2rem;
    margin-bottom: 40px;
  }

  button {
    padding: 15px 25px;
    font-size: 18px;
    cursor: pointer;
    position: absolute;
    transition: all 0.2s ease;
  }
</style>
</head>
<body>

<h2>Você aceita?</h2>
<button id="yes">Sim</button>
<button id="no">Não</button>

<script>
const yesButton = document.getElementById('yes');
const noButton = document.getElementById('no');

// Botão "Sim" redireciona
yesButton.addEventListener('click', () => {
    window.location.href = "https://www.google.com"; // coloque o seu link aqui
});

// Função para mover o botão "Não" aleatoriamente
function moveNoButton() {
    const btnWidth = noButton.offsetWidth;
    const btnHeight = noButton.offsetHeight;
    const screenWidth = window.innerWidth;
    const screenHeight = window.innerHeight;

    // Posição aleatória dentro da tela, sem ultrapassar bordas
    const x = Math.random() * (screenWidth - btnWidth);
    const y = Math.random() * (screenHeight - btnHeight);

    noButton.style.left = `${x}px`;
    noButton.style.top = `${y}px`;
}

// Botão "Não" foge no desktop e no celular
noButton.addEventListener('mouseenter', moveNoButton);
noButton.addEventListener('touchstart', moveNoButton);

// Posiciona os botões inicialmente no centro
function centerButtons() {
    yesButton.style.left = `${window.innerWidth/2 - yesButton.offsetWidth - 10}px`;
    yesButton.style.top = `${window.innerHeight/2}px`;

    noButton.style.left = `${window.innerWidth/2 + 10}px`;
    noButton.style.top = `${window.innerHeight/2}px`;
}

// Ajusta ao carregar e ao redimensionar
window.addEventListener('load', centerButtons);
window.addEventListener('resize', centerButtons);
</script>

</body>
</html>
